<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GHL Updates</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#3B8AF0; --blue-h:#2F7CE0; --gold:#F5B301;
    --ground:#F4F6F8; --card:#FFFFFF; --ink:#151A20; --muted:#5F6A76; --line:#E5E9EE;
    --ok:#1C8A54; --ok-bg:#E7F6EE;
    --side:#191C22; --side-line:rgba(255,255,255,.08); --side-tx:#D6DBE2;
    --teal:#209A9B;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:var(--ink);background:var(--ground);-webkit-font-smoothing:antialiased}
  a{color:var(--blue);text-decoration:none}
  button{font-family:inherit;cursor:pointer}
  /* login */
  .login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#141518;padding:24px}
  .login .box{background:#1E2127;border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:34px 30px;box-shadow:0 16px 50px rgba(0,0,0,.35);text-align:center;width:100%;max-width:390px}
  .login img{height:52px;width:auto;margin-bottom:14px}
  .login h1{font-size:19px;margin:4px 0 4px;color:#fff}
  .login p{color:#99a2ad;font-size:14px;margin:0 0 18px}
  .login input{width:100%;padding:12px 13px;border:1px solid rgba(255,255,255,.14);border-radius:10px;font:inherit;font-size:15px;margin-bottom:12px;background:#141619;color:#fff}
  .login input::placeholder{color:#6b7682}
  .btn{border:0;border-radius:10px;background:var(--blue);color:#fff;font-weight:600;font-size:14px;padding:0 18px;height:40px;display:inline-flex;align-items:center;gap:8px;box-shadow:0 1px 2px rgba(16,24,40,.06)}
  .btn:hover{background:var(--blue-h)}
  .btn.block{width:100%;justify-content:center}
  .btn.outline{background:#fff;color:var(--blue);border:1px solid var(--line);box-shadow:none}
  .btn.outline:hover{background:#f7f9fb}
  .btn:disabled{opacity:.55}
  .note{font-size:12.5px;color:#99a2ad;margin-top:12px;min-height:16px}
  /* app shell */
  .app{display:grid;grid-template-columns:238px 1fr;min-height:100vh}
  .side{background:var(--side);color:var(--side-tx);padding:20px 15px;display:flex;flex-direction:column;gap:5px;border-right:1px solid var(--side-line);position:sticky;top:0;height:100vh;overflow-y:auto}
  .side .brand{padding:6px 8px 18px}
  .side .brand img{height:32px;width:auto;display:block}
  .navlabel{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#7c8794;margin:16px 10px 6px}
  .nav{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;font-size:14px;font-weight:500;color:var(--side-tx);cursor:pointer;border:0;background:transparent;width:100%;text-align:left}
  .nav svg{width:19px;height:19px;opacity:.85;flex:none}
  .nav:hover{background:rgba(255,255,255,.06)}
  .nav.on{background:var(--blue);color:#fff;font-weight:600}
  .nav.on svg{opacity:1}
  .nav.soon{opacity:.5;cursor:default}
  .nav.soon:hover{background:transparent}
  .nav em{margin-left:auto;font-style:normal;font-size:9px;letter-spacing:.05em;text-transform:uppercase;background:rgba(255,255,255,.12);padding:2px 7px;border-radius:99px}
  .navbottom{margin-top:auto;display:flex;flex-direction:column;gap:5px}
  .side .foot{font-size:11px;color:#6b7682;padding:8px;margin-top:8px}
  .main{display:flex;flex-direction:column;min-width:0}
  .top{display:flex;align-items:center;gap:12px;padding:13px 28px;background:#fff;border-bottom:1px solid var(--line)}
  .crumb{font-size:13px;color:var(--muted)}.crumb b{color:var(--ink);font-weight:600}
  .top .sp{flex:1}
  .acct{display:flex;align-items:center;gap:9px;padding:5px 12px 5px 6px;border:1px solid var(--line);border-radius:99px;font-size:13px;font-weight:500;background:#fff}
  .acct .av{width:28px;height:28px;border-radius:99px;background:#e8f0fd;color:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}
  .content{padding:26px 28px 46px;max-width:1180px;width:100%}
  .head{display:flex;align-items:flex-end;gap:12px;margin-bottom:22px;flex-wrap:wrap}
  .head h1{font-size:24px;font-weight:700;margin:0 0 4px;letter-spacing:-.01em}
  .head p{margin:0;color:var(--muted);font-size:14px}
  .head .sp{flex:1}
  .sched{display:inline-flex;align-items:center;gap:7px;height:40px;font-size:13px;color:var(--muted);background:#fff;border:1px solid var(--line);padding:0 14px;border-radius:10px}
  .sched b{color:var(--ink);font-weight:600}
  .kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:24px}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px 18px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
  .kpi b{display:block;font-size:28px;font-weight:700;color:var(--blue);line-height:1.05}
  .kpi span{font-size:12.5px;color:var(--muted)}
  .actbar{display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:12px;margin-bottom:18px;font-size:14px;border:1px solid var(--line)}
  .actbar.on{background:var(--ok-bg);border-color:#bfe4cf;color:#14683f}
  .actbar.off{background:#fff8ec;border-color:#f2e2bf;color:#7a5a00}
  .actbar .sp{flex:1}.actbar b{font-weight:700}
  .tgl{border:0;border-radius:9px;font-weight:600;font-size:13px;padding:9px 15px;cursor:pointer}
  .tgl.go{background:var(--ok);color:#fff}
  .tgl.stop{background:#fff;border:1px solid var(--line);color:var(--muted)}
  .builder{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}
  .sec{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 5px}
  .sechint{font-size:12px;color:var(--muted);margin:0 0 12px}
  .sechint b{color:var(--teal);font-weight:600}
  .post{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px 16px;margin-bottom:12px;display:flex;gap:13px;align-items:flex-start;box-shadow:0 1px 2px rgba(16,24,40,.04)}
  .post.sel{border-color:#bcd4f5;box-shadow:0 1px 2px rgba(59,138,240,.12)}
  .chk{position:relative;flex:none;margin-top:2px;cursor:pointer}
  .chk input{position:absolute;opacity:0;width:20px;height:20px;margin:0;cursor:pointer}
  .chk .box{display:block;width:20px;height:20px;border-radius:6px;border:1.6px solid #cfd6dc;background:#fff}
  .chk input:checked+.box{background:var(--blue);border-color:var(--blue)}
  .chk input:checked+.box:after{content:'';position:absolute;left:7px;top:3px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
  .pbody{flex:1;min-width:0}
  .tags{display:flex;gap:6px;margin-bottom:7px;flex-wrap:wrap}
  .pill{font-size:10.5px;font-weight:600;border-radius:99px;padding:2px 9px}
  .pill.published{background:var(--ok-bg);color:var(--ok)}
  .pill.drafted{background:#eef1f4;color:#5a6672}
  .pill.flagged{background:#fdeceb;color:#c0392b}
  .pill.cat{background:#eef1f4;color:#5a6672}
  .pt{font-size:15px;font-weight:600;line-height:1.32;margin-bottom:4px}
  .pd{font-size:13px;color:var(--muted);line-height:1.5}
  .mini{flex:none;align-self:flex-start;font-size:12.5px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 11px}
  .mini:hover{border-color:#cfd6dc;color:var(--ink)}
  .mini.go{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
  .mini.emailon{background:var(--ok-bg);border-color:#bfe4cf;color:var(--ok);font-weight:600}
  .mini.emailon:hover{border-color:#bfe4cf;color:var(--ok)}
  .mini.emailoff{background:#fdeceb;border-color:#f6d4d0;color:#c0392b;font-weight:600}
  .mini.emailoff:hover{border-color:#f6d4d0;color:#c0392b}
  .mini.sentflag{cursor:default}
  .mini.sentflag:hover{border-color:var(--line);color:var(--muted)}
  .pvwrap{position:sticky;top:18px}
  iframe.preview{width:100%;height:560px;border:1px solid var(--line);border-radius:12px;background:#fff}
  .frame{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 8px 26px rgba(16,40,38,.08)}
  .frame .bar{display:flex;align-items:center;gap:6px;padding:11px 14px;border-bottom:1px solid var(--line);background:#fafbfc}
  .frame .bar i{width:10px;height:10px;border-radius:99px;background:#e4e8ec;display:inline-block}
  .frame .bar .subj{margin-left:8px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .frame .bar .subj b{color:var(--ink);font-weight:600}
  .frame iframe{display:block;width:100%;height:680px;border:0;background:#fff}
  .emailgrid{grid-template-columns:290px 1fr}
  .esidebar{display:flex;flex-direction:column;gap:12px}
  .esidebar .sched{width:100%;justify-content:center}
  .esidebar .btn{width:100%;justify-content:center}
  .esidebar .actbar{flex-direction:column;align-items:stretch;gap:10px}
  .esidebar .actbar .sp{display:none}
  .esidebar .actbar .tgl{width:100%}
  .esidebar .kpis{grid-template-columns:1fr;gap:10px;margin-bottom:0}
  /* settings */
  .scard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-bottom:16px;box-shadow:0 1px 2px rgba(16,24,40,.04);max-width:640px}
  .scard h2{font-size:15px;margin:0 0 14px}
  .row{display:flex;gap:12px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
  .row label{font-size:13px;font-weight:600;min-width:120px}
  input[type=text],input[type=number],select{font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:9px;min-width:120px}
  input[type=text]:focus,input[type=number]:focus,select:focus{outline:2px solid rgba(59,138,240,.4);border-color:var(--blue)}
  input[type=checkbox]{width:18px;height:18px;accent-color:var(--blue)}
  .muted{color:var(--muted);font-size:13px}
  .fbar{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
  .fchip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 14px;font-size:13px;font-weight:500;color:var(--muted)}
  .fchip.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .fchip b{font-weight:700}
  .pacts{flex:none;display:flex;flex-direction:column;gap:8px;align-items:stretch;width:118px}
  .pacts .mini{width:100%;text-align:center}
  .req{display:flex;gap:14px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
  .vote{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:52px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--muted);padding:8px 0}
  .vote span{font-size:12px;line-height:1}.vote b{font-size:15px;color:var(--ink)}
  .vote.on{border-color:var(--blue);background:#eef5fe;color:var(--blue)}.vote.on b{color:var(--blue)}
  .rbody{flex:1;min-width:0}
  .rt{font-size:15px;font-weight:600;line-height:1.3}
  .rd{font-size:13px;color:var(--muted);line-height:1.5;margin-top:3px}
  .rmeta{display:flex;align-items:center;gap:8px;margin-top:9px;flex-wrap:wrap}
  .rstat{font-size:12px;padding:5px 8px;min-width:auto}
  .cl{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-bottom:10px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
  textarea{font:inherit}
  .pill.st-open{background:#eef1f4;color:#5a6672}
  .pill.st-under_review{background:#fff3e0;color:#8a5a00}
  .pill.st-planned{background:#e9f0fe;color:#2f6fd0}
  .pill.st-in_progress{background:#e7f0ff;color:#2f6fd0}
  .pill.st-shipped{background:var(--ok-bg);color:var(--ok)}
  .pill.st-declined{background:#f3f4f6;color:#9aa0a6}
  /* onboarding wizard */
  .wiz{min-height:100vh;background:#141518;display:flex;flex-direction:column;align-items:center;padding:0 20px 40px}
  .wiztop{width:100%;max-width:640px;display:flex;align-items:center;gap:14px;padding:22px 0 0}
  .wiztop img{height:30px}
  .wiztop .skip{margin-left:auto;color:#99a2ad;font-size:13px;background:none;border:0;cursor:pointer}
  .wiztop .skip:hover{color:#fff}
  .wprog{width:100%;max-width:640px;margin:18px 0 0;height:6px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden}
  .wprog i{display:block;height:100%;background:var(--blue);border-radius:99px;transition:width .25s}
  .wsteplabel{width:100%;max-width:640px;color:#7c8794;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;margin:11px 0 0}
  .wizcard{width:100%;max-width:640px;background:#fff;border-radius:16px;padding:32px 34px;margin:14px 0 0;box-shadow:0 20px 60px rgba(0,0,0,.30)}
  .wizcard h1{font-size:23px;margin:0 0 6px}
  .wizcard .lead{color:var(--muted);font-size:15px;margin:0 0 22px;line-height:1.55}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
  .field input[type=text],.field input[type=url],.field select,.field textarea{width:100%}
  .field .hint{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.4}
  .field.inline{display:flex;gap:12px;align-items:center}
  .field.inline > *{margin:0}
  .wtoggle{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;cursor:pointer}
  .wtoggle input{margin-top:2px;width:18px;height:18px;flex:none}
  .wtoggle .tt{display:block;font-size:14px;font-weight:600}
  .wtoggle .td{display:block;font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.45}
  .wizfoot{display:flex;align-items:center;gap:12px;margin-top:26px}
  .wizfoot .sp{flex:1}
  .lnk{background:none;border:0;color:var(--muted);font-size:14px;cursor:pointer;padding:8px 4px}
  .lnk:hover{color:var(--ink)}
  .checklist{list-style:none;padding:0;margin:0}
  .checklist li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;font-size:14px}
  .checklist li svg{width:18px;height:18px;color:var(--blue);flex:none;margin-top:2px}
  .ok-badge{display:inline-flex;align-items:center;gap:6px;background:var(--ok-bg);color:var(--ok);font-size:13px;font-weight:600;padding:6px 12px;border-radius:99px;margin-bottom:14px}
  .steps-num{list-style:none;padding:0;margin:0 0 18px;counter-reset:s}
  .steps-num li{counter-increment:s;position:relative;padding:6px 0 6px 30px;font-size:13.5px;color:var(--ink)}
  .steps-num li:before{content:counter(s);position:absolute;left:0;top:5px;width:20px;height:20px;border-radius:99px;background:var(--blue);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .rev{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
  .rev:last-child{border-bottom:0}.rev .k{color:var(--muted)}.rev .v{font-weight:600;text-align:right}
  .err{color:#c0392b;font-size:13px;margin-top:10px}
  .swatch{width:40px;height:40px;border-radius:9px;border:1px solid var(--line);padding:0;cursor:pointer;background:none}
  .modal{position:fixed;inset:0;background:rgba(16,24,32,.5);display:flex;align-items:flex-start;justify-content:center;z-index:50;padding:34px 20px;overflow:auto}
  .modal .sheet{background:#fff;border-radius:16px;max-width:720px;width:100%;padding:24px 26px;box-shadow:0 24px 70px rgba(0,0,0,.32)}
  .modal h2{font-size:18px;margin:0 0 4px}
  .modal .msub{color:var(--muted);font-size:13px;margin:0 0 18px}
  .modal label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
  .modal input[type=text],.modal textarea{width:100%}
  .ed-body{border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-height:220px;max-height:50vh;overflow:auto;font-size:14px;line-height:1.65;outline:none;background:#fff}
  .ed-body:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,138,240,.15)}
  .ed-body h2{font-size:17px;margin:16px 0 8px}.ed-body p{margin:0 0 12px}.ed-body ul,.ed-body ol{margin:0 0 12px;padding-left:22px}
  .mfoot{display:flex;gap:10px;align-items:center;margin-top:20px}.mfoot .sp{flex:1}
  @media(max-width:900px){.app{grid-template-columns:1fr}.side{display:none}.builder{grid-template-columns:1fr}.pvwrap{position:static}.kpis{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"><div class="login"><div class="box"><img src="logo.png" alt="GHL Updates" style="height:44px;margin-bottom:14px"><p class="muted">Loading…</p></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

function scheduleLabel(s) {
  if (s.digest_day == null || s.digest_hour == null) return 'Not scheduled';
  const h = s.digest_hour, ap = h < 12 ? 'am' : 'pm', h12 = ((h + 11) % 12) + 1;
  return `${DAYS[s.digest_day]}s ${h12}:00 ${ap}`;
}
function initials(email) { return (email || '?').slice(0, 2).toUpperCase(); }
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function ordinal(n) { const v = n % 100; if (v >= 11 && v <= 13) return n + 'th'; return n + ({1:'st',2:'nd',3:'rd'}[n % 10] || 'th'); }
function fmtSentDate(iso) { if (!iso) return ''; const d = new Date(iso); return `${ordinal(d.getDate())} of ${MONTHS[d.getMonth()]}`; }

function renderLogin(msg) {
  app.innerHTML = `<div class="login"><div class="box">

  document.getElementById('go').onclick = async () => {
    const email = document.getElementById('em').value.trim();
    document.getElementById('msg').textContent = 'Sending…';

  };
}

// Post-payment handoff: Stripe redirects a brand-new customer here with no session and no
// idea what to do next. If we can resolve their email from the checkout session, auto-send
// the magic link so they don't have to type it in again.
function renderCheckoutMsg(body, showForm, prefillEmail) {
  app.innerHTML = `<div class="login"><div class="box">
    <img src="${GHL_LOGO}" alt="GHL Updates">
    <h1>Payment received!</h1><p>${body}</p>
    ${showForm ? `<input id="em" type="text" placeholder="you@example.com" value="${prefillEmail ? esc(prefillEmail) : ''}">
    <button class="btn block" id="go">Send magic link</button>` : ''}
    <p class="note" id="msg"></p>
  </div></div>`;
  if (showForm) {
    document.getElementById('go').onclick = async () => {
      const email = document.getElementById('em').value.trim();
      document.getElementById('msg').textContent = 'Sending…';
      const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: location.origin + location.pathname } });
      document.getElementById('msg').textContent = error ? error.message : 'Check your inbox for the link.';
    };
  }
}

async function handleCheckoutSuccess() {
  history.replaceState(null, '', location.pathname);
  renderCheckoutMsg('Setting up your login…', false);
  let email = '';
  if (CHECKOUT_SESSION_ID) {
    try {
      const r = await fetch(`${DASH}?action=session-email&session_id=${encodeURIComponent(CHECKOUT_SESSION_ID)}`);
      const data = await r.json();
      if (data.email) email = data.email;
    } catch (e) {}
  }
  if (email) {
    const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: location.origin + location.pathname } });
    if (!error) { renderCheckoutMsg(`We've sent a login link to ${esc(email)}. Click it to finish setting up your account.`, false); return; }
  }
  renderCheckoutMsg("Enter your email and we'll send you a link to finish setting up your account.", true, email);
}

async function renderPosts() {
  const view = document.getElementById('view');
  if (!view.dataset.loaded) view.innerHTML = `<p class="muted">Loading…</p>`;
  const { posts } = await api('posts');
  const all = posts || [];
  const counts = { all: all.length, needs: all.filter((p) => p.status !== 'published').length, published: all.filter((p) => p.status === 'published').length };
  const show = POSTFILTER === 'needs' ? all.filter((p) => p.status !== 'published') : POSTFILTER === 'published' ? all.filter((p) => p.status === 'published') : all;
  const chip = (k, l, n) => `<button class="fchip${POSTFILTER === k ? ' on' : ''}" data-f="${k}">${l} <b>${n}</b></button>`;
  const row = (p) => {
    const sent = p.status === 'published' && !!p.emailed_at;
    const emailBtn = sent
      ? `<div class="mini sentflag" title="Sent ${esc(fmtSentDate(p.emailed_at))}">Sent ${esc(fmtSentDate(p.emailed_at))}</div>`
      : `<button class="mini dig${p.in_digest ? ' emailon' : ' emailoff'}" data-on="${p.in_digest ? '0' : '1'}" title="${p.in_digest ? 'Click to leave out of the email' : 'Click to include in the email'}">${p.in_digest ? 'In email' : 'Not in email'}</button>`;
    return `<div class="post" data-id="${p.id}">
    <div class="pbody">
      <div class="tags"><span class="pill ${p.status}">${p.status}</span>${(p.categories || []).slice(0, 1).map((c) => `<span class="pill cat">${esc(c)}</span>`).join('')}${p.flag ? '<span class="pill flagged">flagged</span>' : ''}</div>
      <div class="pt">${esc(p.title)}</div><div class="pd">${esc(p.description || '')}</div>
      ${p.flag ? `<div style="font-size:12px;color:#c0392b;margin-top:6px">${esc(p.flag)}</div>` : ''}
    </div>
    <div class="pacts">
      <button class="mini edit">Edit</button>
      ${emailBtn}
      ${p.status === 'published' ? '<button class="mini hold">Unpublish</button>' : '<button class="mini go pub">Publish</button>'}
    </div>
  </div>`;
  };
  view.innerHTML = `
    <div class="head"><div><h1>Posts</h1><p>Review, publish, and choose where each update goes.</p></div></div>
    <div class="fbar">${chip('needs', 'Needs review', counts.needs)}${chip('published', 'Published', counts.published)}${chip('all', 'All', counts.all)}</div>
    ${show.length ? show.map(row).join('') : '<p class="muted">No posts here yet.</p>'}`;
  view.dataset.loaded = '1';
  view.querySelectorAll('.fchip').forEach((b) => b.onclick = () => { POSTFILTER = b.dataset.f; renderPosts(); });
  view.querySelectorAll('.post').forEach((r) => {
    const id = r.dataset.id;
    const dig = r.querySelector('.dig'); if (dig) dig.onclick = async () => { dig.disabled = true; await api('toggle-digest', { id, in_digest: dig.dataset.on === '1' }); renderPosts(); };
    const pub = r.querySelector('.pub'); if (pub) pub.onclick = async () => { pub.disabled = true; await api('publish', { id }); renderPosts(); };
    const hold = r.querySelector('.hold'); if (hold) hold.onclick = async () => { hold.disabled = true; await api('hold', { id }); renderPosts(); };
    const ed = r.querySelector('.edit'); if (ed) ed.onclick = () => editPost(id);
  });
}

  </div>`;
  document.body.appendChild(m);
  document.getElementById('ebody').innerHTML = post.body_html || '';
  const close = () => m.remove();
  document.getElementById('ecancel').onclick = close;
  m.onclick = (e) => { if (e.target === m) close(); };
  document.getElementById('esave').onclick = async () => {
    const btn = document.getElementById('esave'); btn.disabled = true;
    document.getElementById('emsg').textContent = 'Saving…';
    await api('edit-post', { id, title: document.getElementById('etitle').value.trim(), description: document.getElementById('edesc').value.trim(), body_html: document.getElementById('ebody').innerHTML });
    close(); renderPosts();
  };
}

async function renderRequests() {
  const view = document.getElementById('view');
  if (!view.dataset.loaded) view.innerHTML = `<p class="muted">Loading…</p>`;
  const { requests, changelog } = await api('requests');
  const STATUS = { open: 'Open', under_review: 'Under review', planned: 'Planned', in_progress: 'In progress', shipped: 'Shipped', declined: 'Declined' };
  const statusSel = (p) => `<select class="rstat" data-id="${p.id}">${Object.keys(STATUS).map((k) => `<option value="${k}" ${p.status === k ? 'selected' : ''}>${STATUS[k]}</option>`).join('')}</select>`;
  const reqRow = (p) => `<div class="req">
    <button class="vote${p.voted ? ' on' : ''}" data-id="${p.id}" data-on="${p.voted ? '0' : '1'}" title="${p.voted ? 'Remove your upvote' : 'Upvote'}">${p.voted ? `<b>${p.vote_count}</b><span>&#9660;</span>` : `<span>&#9650;</span><b>${p.vote_count}</b>`}</button>
    <div class="rbody"><div class="rt">${esc(p.title)}</div>${p.body ? `<div class="rd">${esc(p.body)}</div>` : ''}<div class="rmeta"><span class="pill st-${p.status}">${STATUS[p.status] || p.status}</span>${DATA.agency.is_admin ? statusSel(p) : ''}</div></div>
  </div>`;
  const clRow = (p) => `<div class="cl"><div class="rt">${esc(p.title)}</div>${p.body ? `<div class="rd">${esc(p.body)}</div>` : ''}<div class="muted" style="font-size:11.5px;margin-top:4px">${(p.updated_at || '').slice(0, 10)}</div></div>`;
  view.innerHTML = `
    <div class="head"><div><h1>Requests</h1><p>Tell us what to build next — upvote what matters to you.</p></div></div>
    <div class="builder">
      <div>
        <div class="scard"><h2>Suggest a feature</h2>
          <input type="text" id="rtitle" placeholder="Short title" style="width:100%;margin-bottom:8px">
          <textarea id="rbody" placeholder="What would it do? (optional)" style="width:100%;min-height:68px;padding:9px 11px;border:1px solid var(--line);border-radius:9px"></textarea>
          <div style="margin-top:10px"><button class="btn" id="radd">Submit request</button><span class="muted" id="rmsg" style="margin-left:10px"></span></div>
        </div>
        <div class="sec">Requests</div><div class="sechint">Sorted by votes.</div>
        ${requests.length ? requests.map(reqRow).join('') : '<p class="muted">No requests yet — add the first.</p>'}
      </div>
      <div class="pvwrap">
        <div class="sec">Latest updates</div><div class="sechint">Recently shipped.</div>
        ${changelog.length ? changelog.map(clRow).join('') : '<p class="muted">Nothing shipped yet.</p>'}
      </div>
    </div>`;
  view.dataset.loaded = '1';
  document.getElementById('radd').onclick = async () => {
    const title = document.getElementById('rtitle').value.trim(); if (!title) return;
    document.getElementById('rmsg').textContent = 'Saving…';
    await api('request-add', { title, body: document.getElementById('rbody').value.trim() }); renderRequests();
  };
  view.querySelectorAll('.vote').forEach((b) => b.onclick = async () => { await api('request-vote', { id: b.dataset.id, on: b.dataset.on === '1' }); renderRequests(); });
  view.querySelectorAll('.rstat').forEach((s) => s.onchange = async () => { await api('request-status', { id: s.dataset.id, status: s.value }); renderRequests(); });
}

async function renderEmail() {
  const view = document.getElementById('view');
  if (!view.dataset.loaded) view.innerHTML = `<p class="muted">Loading…</p>`;
  const [{ posts }, prev] = await Promise.all([api('posts'), api('preview')]);
  const publishedCount = (posts || []).filter((p) => p.status === 'published').length;
  const sched = scheduleLabel(DATA.settings || {});
  const active = DATA.agency.sending_active;

  view.innerHTML = `
    <div class="head"><div><h1>This week's email</h1><p>Preview what goes out, then send.</p></div></div>
    <div class="builder emailgrid">
      <div class="esidebar">
        <div class="sched">Scheduled <b>${esc(sched)}</b></div>
        <button class="btn outline" id="editsched">Edit schedule</button>
        <button class="btn" id="sendnow">Send now</button>
        ${active
          ? `<div class="actbar on"><span>Weekly sending is <b>ON</b> — goes out automatically ${esc(sched)}.</span><button class="tgl stop" id="acttoggle">Turn off</button></div>`
          : `<div class="actbar off"><span>Weekly sending is <b>OFF</b>. Activate to start sending automatically on your schedule (${esc(sched)}).</span><button class="tgl go" id="acttoggle">Activate sending</button></div>`}
        <div class="kpis">
          <div class="kpi"><b>${prev.post_count ?? 0}</b><span>in this email</span></div>
          <div class="kpi"><b>${prev.recipient_count ?? '—'}</b><span>recipients</span></div>
          <div class="kpi"><b>${publishedCount}</b><span>published</span></div>
        </div>
        <p class="sechint">To adjust which posts are included in this week's email, go to the <b style="color:var(--blue)">Posts</b> page.</p>
      </div>
      <div class="pvwrap">
        <div class="sec">Live preview</div>
        <div class="sechint">Shown in <b>${esc(DATA.agency.name)}'s</b> brand — exactly what members receive.</div>
        <div class="frame">
          <div class="bar"><i></i><i></i><i></i><span class="subj">Subject: <b>${esc(prev.subject || '')}</b></span></div>
          <iframe srcdoc="${esc(prev.html || '<p style=&quot;padding:24px;font-family:sans-serif;color:#888&quot;>No posts selected.</p>')}"></iframe>
        </div>
      </div>
    </div>`;
  view.dataset.loaded = '1';
  document.getElementById('editsched').onclick = () => { TAB = 'settings'; renderApp(); };
  const tog = document.getElementById('acttoggle');
  if (tog) tog.onclick = async () => {
    if (!active && !confirm(`Turn ON automatic weekly sending?\n\nYour email will then go out to your members every ${sched}.`)) return;
    tog.disabled = true;
    await api('settings', { sending_active: !active });
    DATA = await api('agency'); renderEmail();
  };
  document.getElementById('sendnow').onclick = async () => {
    const n = prev.recipient_count, cnt = prev.post_count || 0;
    if (!cnt) { alert('No posts are selected for the email yet. Tick "In email" on a published post first.'); return; }
    if (!confirm(`Send this week's email now?\n\n${cnt} update${cnt === 1 ? '' : 's'} to ${n != null ? n + ' recipients' : 'your members'}.\nThis goes out from your own HighLevel, drip-paced at your chosen rate.`)) return;
    const r = await api('send-now');
    alert(r.ok ? 'Queued. Your email will start going out shortly (drip-paced).' : (r.error || 'Could not queue the send.'));
  };
}

async function renderSettings() {
  const view = document.getElementById('view');
  const a = DATA.agency || {};
  const s = DATA.settings || {};
  const rate = s.digest_rate || {};
  const dayOpts = DAYS.map((d, i) => `<option value="${i}" ${s.digest_day===i?'selected':''}>${d}</option>`).join('');
  const hourOpts = Array.from({ length: 24 }, (_, h) => `<option value="${h}" ${s.digest_hour===h?'selected':''}>${String(h).padStart(2,'0')}:00</option>`).join('');
  const perOpts = ['minute','hour','day'].map((p) => `<option value="${p}" ${rate.period===p?'selected':''}>per ${p}</option>`).join('');
  const tz = s.digest_timezone || 'Australia/Brisbane';
  const tzList = TZS.includes(tz) ? TZS : [tz, ...TZS];
  const tzOpts = tzList.map((z) => `<option value="${esc(z)}" ${z===tz?'selected':''}>${esc(z)}</option>`).join('');
  view.innerHTML = `
    <div class="head"><div><h1>Settings</h1><p>Your company profile, contact details, and how your weekly email goes out.</p></div></div>

    <div class="sec">Company</div>
    <div class="builder">
      <div>
        <div class="scard"><h2>Brand</h2>
          <div class="row"><label>Business name</label><input type="text" id="cname" value="${esc(a.name||'')}" style="min-width:220px"></div>
          <div class="row"><label>Brand colour</label><input type="color" class="swatch" id="ccolor" value="${esc(a.brand_primary||'#3B8AF0')}"><input type="text" id="ccolorhex" value="${esc(a.brand_primary||'#3B8AF0')}" style="max-width:140px"></div>
          <div class="row"><label>Logo URL</label><input type="text" id="clogo" value="${esc(a.logo_url||'')}" style="min-width:280px" placeholder="https://…/logo.png"></div>
        </div>
        <div class="scard"><h2>Billing</h2>
          ${a.has_billing
            ? `<p class="muted" style="margin-bottom:12px">Manage your card, invoices, or cancel your plan.</p><button class="mini go" id="billing" style="width:auto">Manage billing</button>`
            : `<p class="muted">No billing account on file yet.</p>`}
        </div>
      </div>
      <div>
        <div class="scard"><h2>Your details</h2>
          <div class="row"><label>Your name</label><input type="text" id="pname" value="${esc(a.owner_name||'')}" style="min-width:220px"></div>
          <div class="row"><label>Phone</label><input type="text" id="pphone" value="${esc(a.owner_phone||'')}" style="min-width:200px"></div>
          <div class="row"><label>Email</label><span class="muted">${esc(SESSION.user.email)}</span></div>
          <p class="muted" style="margin-top:8px">To change your login email, contact us.</p>
        </div>
      </div>
    </div>

    <div class="sec" style="margin-top:28px">Email delivery</div>
    <div class="builder">
      <div>
        <div class="scard"><h2>Send schedule</h2>
          <div class="row"><label>Day</label><select id="day">${dayOpts}</select>
            <label style="min-width:auto">Time</label><select id="hour">${hourOpts}</select></div>
          <div class="row"><label>Timezone</label><select id="tz" style="min-width:220px">${tzOpts}</select></div>
          <div class="row"><label>Enabled</label><input type="checkbox" id="en" ${s.digest_enabled!==false?'checked':''}></div>
        </div>
        <div class="scard"><h2>Send rate</h2>
          <div class="row"><label>Send</label><input type="number" id="rq" value="${rate.qty!=null?rate.qty:''}" min="1" placeholder="e.g. 25" style="min-width:90px"> emails <select id="rp">${perOpts}</select></div>
          <p class="muted">The exact pace your emails go out. Choose what suits your list and sending reputation.</p>
        </div>
      </div>
      <div>
        <div class="scard"><h2>Links</h2>
          <div class="row"><label>"See all" link</label><input type="text" id="au" value="${esc(s.all_updates_url||'')}" style="min-width:320px"></div>
          <p class="muted">Where the email's bottom button points — your full updates page.</p>
        </div>
        <div class="scard"><h2>Recipients</h2>
          <p class="muted">${s.segment_status_count||0} approved statuses · ${s.recipient_count ?? '—'} members. (Managed by us for now.)</p>
        </div>
      </div>
    </div>
    <button class="btn" id="save">Save settings</button>
    <span class="muted" id="saved" style="margin-left:12px"></span>`;

  const c = document.getElementById('ccolor'), t = document.getElementById('ccolorhex');
  if (c && t) { c.oninput = () => { t.value = c.value; }; t.oninput = () => { if (/^#[0-9a-fA-F]{6}$/.test(t.value)) c.value = t.value; }; }

  const billingBtn = document.getElementById('billing');
  if (billingBtn) billingBtn.onclick = async () => {
    billingBtn.disabled = true; const o = billingBtn.textContent; billingBtn.textContent = 'Loading…';
    const r = await api('portal');
    if (r.url) location.href = r.url;
    else { alert(r.error || 'Could not open billing.'); billingBtn.disabled = false; billingBtn.textContent = o; }
  };

  document.getElementById('save').onclick = async () => {
    const body = {
      name: document.getElementById('cname').value.trim(),
      brand_primary: (document.getElementById('ccolorhex').value || document.getElementById('ccolor').value).trim(),
      logo_url: document.getElementById('clogo').value.trim(),
      owner_name: document.getElementById('pname').value.trim(),
      owner_phone: document.getElementById('pphone').value.trim(),
      digest_day: Number(document.getElementById('day').value),
      digest_hour: Number(document.getElementById('hour').value),
      digest_timezone: document.getElementById('tz').value.trim(),
      digest_enabled: document.getElementById('en').checked,
      all_updates_url: document.getElementById('au').value.trim(),
      digest_rate: { qty: Number(document.getElementById('rq').value), period: document.getElementById('rp').value },
    };
    document.getElementById('saved').textContent = 'Saving…';
    const r = await api('settings', body);
    document.getElementById('saved').textContent = r.ok ? 'Saved ✓' : (r.error || 'Error');
    DATA = await api('agency');
  };
}

function route() {
  if (SESSION) { renderApp(); return; }
  if (CHECKOUT_SUCCESS) {
    if (CHECKOUT_HANDLED) return; // already in flight/done from an earlier onAuthStateChange firing
    CHECKOUT_HANDLED = true;
    handleCheckoutSuccess();
    return;
  }
  renderLogin();
}
sb.auth.onAuthStateChange((_e, s) => { SESSION = s; route(); });
sb.auth.getSession().then(({ data }) => { SESSION = data.session; route(); });
</script>
</body>
</html>
